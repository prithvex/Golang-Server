<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Web Server</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        .container{
            max-width:800px;
            margin:80px auto;
            background:#fff;
            padding:40px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,.1);
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        p{
            color:#666;
            margin-bottom:30px;
        }

        a{
            text-decoration:none;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Welcome to My Go Web Server 🚀</h1>

    <p>
        This website is built using Go's <strong>net/http</strong> package.
    </p>

    <a href="/form.html">
        <button>Open Form</button>
    </a>

    <br><br>

    <a href="/hello">
        <button>Say Hello</button>
    </a>

</div>

</body>
</html>
